**Q. Design a website for book information. The home page should contain a list of books. When a particular book is clicked, the information about that book should be displayed on the next page.**

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book World</title>
</head>
<body>

    <h1 align="center">Book World</h1>

    <ol>
        <li><a href="book-one.html">The Alchemist</a></li>
        <li><a href="book-two.html">Atomic Habits</a></li>
        <li><a href="book-three.html">Harry Potter</a></li>
    </ol>

    <footer>
        &copy; Book World 2026
    </footer>

</body>
</html>
