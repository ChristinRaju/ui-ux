<html>
<body>

<h2>Factorial</h2>

<input type="text" id="num" placeholder="Enter number">
<button onclick="fact()">Calculate</button>

<p id="result"></p>

<script>
function fact() {
    let n = document.getElementById("num").value;
    let fact = 1;

    for (let i = 1; i <= n; i++) {
        fact = fact * i;
    }

    document.getElementById("result").innerHTML = fact;
}
</script>

</body>
</html>
