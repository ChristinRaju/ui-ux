<html>
<body>

<h2>Fibonacci Series</h2>

<input type="text" id="num" placeholder="Enter number">
<button onclick="fib()">Calculate</button>

<p id="result"></p>

<script>
function fib() {
    let a = 0, b = 1;
    let n = document.getElementById("num").value;
    let s = "";

    for (let i = 1; i <= n; i++) {
        s += a + " ";
        let c = a + b;
        a = b;
        b = c;
    }

    document.getElementById("result").innerHTML = s;
}
</script>

</body>
</html>
