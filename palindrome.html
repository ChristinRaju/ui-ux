<html>
<body>

<h2>Palindrome</h2>

<input type="text" id="num" placeholder="Enter number">
<button onclick="check()">Check</button>

<p id="result"></p>

<script>
function check() {
    let n = document.getElementById("num").value;
    let t = n, rev = 0;

    while (n > 0) {
        rev = rev * 10 + n % 10;
        n = Math.floor(n / 10);
    }

    if (t == rev)
        document.getElementById("result").innerHTML = "Palindrome";
    else
        document.getElementById("result").innerHTML = "Not Palindrome";
}
</script>

</body>
</html>
